    <circle class="dot" cx="130" cy="235" r="10"/>
    <circle class="dot" cx="166" cy="235" r="10"/>
    <circle class="dot" cx="148" cy="276" r="10"/>
    <path class="line" d="M332 224l56 56"/>
  </g>
  <g transform="rotate(-45 256 256)">
    <rect class="bandage" x="76" y="198" width="360" height="116" rx="58"/>
    <path class="line" d="M124 224l56 56M332 224l56 56"/>
    <circle class="dot" cx="238" cy="232" r="10"/>
    <circle class="dot" cx="274" cy="232" r="10"/>
    <circle class="dot" cx="238" cy="280" r="10"/>
    <circle class="dot" cx="274" cy="280" r="10"/>
  </g>
</svg>
