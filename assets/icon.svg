<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Today's Repair icon</title>
  <desc id="desc">Two crossed bandaids as a simple repair mark.</desc>
  <rect width="512" height="512" rx="96" fill="#f4f6f3"/>
  <defs>
    <style>
      .bandage { fill: #f4f6f3; stroke: #111; stroke-width: 28; }
      .line { fill: none; stroke: #111; stroke-width: 20; stroke-linecap: round; }
      .dot { fill: #111; }
    </style>
  </defs>
  <g transform="rotate(45 256 256)">
