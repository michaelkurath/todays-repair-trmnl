name: Update Today Payload

on:
  schedule:
    - cron: "7 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate data
        run: python3 scripts/validate_data.py

      - name: Build today payload
        run: python3 scripts/build_today.py

      - name: Commit if changed
        run: |
          if git diff --quiet data/today.json; then
            echo "today.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/today.json
          git commit -m "Update today payload"
          git push
